name: Verify workspace and trained release
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check backend training tests scripts
      - run: uv run pytest -q
      - run: uv run python scripts/release_gate.py
      - run: npm ci --prefix web --ignore-scripts
      - run: npm run build
      - run: npm audit --prefix web --audit-level high
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Verify real model and browser workflow
        run: |
          .venv/bin/uvicorn scenetrace.app:app --host 127.0.0.1 --port 4350 --no-access-log >/tmp/scenetrace-api.log 2>&1 &
          SCENETRACE_API_PID=$!
          trap 'kill "$SCENETRACE_API_PID" 2>/dev/null || true; wait "$SCENETRACE_API_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4350/api/health >/dev/null; then break; fi
            sleep 1
          done
          npm test --prefix web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            evidence/
            web/test-results/
