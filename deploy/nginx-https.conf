server {
    listen 80;
    listen [::]:80;
    server_name scenetrace.193-203-15-98.sslip.io;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/scenetrace/acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name scenetrace.193-203-15-98.sslip.io;
    ssl_certificate /etc/letsencrypt/live/scenetrace.193-203-15-98.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scenetrace.193-203-15-98.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 50m;
    client_body_timeout 90s;
    access_log off;
    add_header Strict-Transport-Security "max-age=86400" always;
    location / {
        proxy_pass http://127.0.0.1:4360;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
